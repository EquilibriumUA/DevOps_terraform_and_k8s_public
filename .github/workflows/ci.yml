name: CI/CD

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/analytics

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Run unit tests with coverage
        id: tests
        env:
          NODE_ENV: test
        run: npm run test:ci

      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Build production app
        env:
          NODE_ENV: production
        run: npm run build

  deploy:
    name: Build and Deploy
    needs: checks
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      AWS_REGION: eu-central-1
      EKS_CLUSTER_NAME: Terraform-Kubernetes-Project-dev
      ECR_REPOSITORY: terraform-kubernetes-project-dev
      K8S_NAMESPACE: analytics
      DEPLOYMENT_NAME: analytics-dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::AWSID:role/Terraform-Kubernetes-Project-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

          docker push \
            "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy Kubernetes manifests
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          kubectl apply -f k8s/service.yml
          kubectl apply -f k8s/monitoring/pulsemetrics-servicemonitor.yml
          kubectl apply -f k8s/monitoring/pulsemetrics-prometheusrule.yml

          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" \
            k8s/deployment.yml | kubectl apply -f -

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/"$DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME" \
            --namespace "$K8S_NAMESPACE"

          kubectl get pods \
            --namespace "$K8S_NAMESPACE"

          kubectl get service \
            --namespace "$K8S_NAMESPACE"
