apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pulsemetrics
  namespace: analytics
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: analytics-dashboard

  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s

  namespaceSelector:
    matchNames:
      - analytics
