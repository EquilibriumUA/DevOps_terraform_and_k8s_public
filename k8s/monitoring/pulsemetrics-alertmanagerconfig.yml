apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: pulsemetrics
  namespace: analytics
spec:
  route:
    receiver: pulsemetrics-email
    matchers:
      - name: app
        matchType: "="
        value: pulsemetrics
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 12h

  receivers:
    - name: pulsemetrics-email
      emailConfigs:
        - to: "TargetMail"
          from: "SourceMail"
          smarthost: "HostAddress"
          authUsername: "Username"
          authPassword:
            name: alertmanager-smtp
            key: password
          requireTLS: true
