apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-servicemonitor
  namespace: analytics
rules:
  - apiGroups:
      - monitoring.coreos.com
    resources:
      - servicemonitors
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
rules:
- apiGroups:
    - monitoring.coreos.com
  resources:
    - servicemonitors
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
- apiGroups:
    - monitoring.coreos.com
  resources:
    - prometheusrules
  verbs:
    - get
    - list
    - watch
    - create
    - update
    - patch
    - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-servicemonitor
  namespace: analytics
subjects:
  - kind: Group
    name: github-actions
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-servicemonitor
  apiGroup: rbac.authorization.k8s.io
